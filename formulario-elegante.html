<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Familiar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent-dim: #06b6d4;
      --border: #334155;
      --error: #f87171;
      --success: #4ade80;
      --focus-ring: rgba(34, 211, 238, 0.35);
      --shadow: 0 10px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.03) inset;
      --radius: 14px;
      --transition: 180ms ease;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --bg-card: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --accent: #06b6d4;
        --accent-dim: #0891b2;
        --border: #e2e8f0;
        --shadow: 0 10px 40px rgba(15,23,42,0.08), 0 0 0 1px rgba(15,23,42,0.04) inset;
      }
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      line-height: 1.6;
      /* Animated gradient background */
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 211, 238, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(168, 85, 247, 0.12), transparent),
        radial-gradient(ellipse 50% 30% at 10% 30%, rgba(251, 146, 60, 0.1), transparent);
      background-attachment: fixed;
    }
    @media (prefers-color-scheme: light) {
      body {
        background-image: 
          radial-gradient(ellipse 80% 50% at 50% -20%, rgba(6, 182, 212, 0.12), transparent),
          radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139, 92, 246, 0.1), transparent),
          radial-gradient(ellipse 50% 30% at 10% 30%, rgba(249, 115, 22, 0.08), transparent);
      }
    }
    .form-card {
      width: 100%;
      max-width: 560px;
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2.5rem;
      border: 1px solid var(--border);
      animation: slideUp 0.5s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .form-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .form-header .icon {
      width: 56px; height: 56px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: var(--bg);
    }
    .form-header h1 {
      font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em;
    }
    .form-header p { color: var(--muted); font-size: 0.95rem; margin-top: 0.35rem; }
    .form-grid { display: grid; gap: 1.25rem; }
    .form-row { display: grid; gap: 1rem; }
    @media (min-width: 520px) {
      .form-row--half { grid-template-columns: 1fr 1fr; }
    }
    .field { position: relative; }
    .field label {
      display: block; font-size: 0.8rem; font-weight: 500;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }
    .field input {
      width: 100%; padding: 0.875rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--fg);
      font: inherit; font-size: 1rem;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .field input::placeholder { color: var(--muted); opacity: 0.6; }
    .field input:hover { border-color: var(--accent-dim); }
    .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    .field input:invalid:not(:placeholder-shown) { border-color: var(--error); }
    .field input:valid:not(:placeholder-shown) { border-color: var(--success); }
    .field .hint {
      position: absolute; right: 1rem; bottom: 0.9rem;
      font-size: 0.7rem; color: var(--muted); pointer-events: none;
    }
    .field--dob { position: relative; }
    .field--dob .dob-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;
    }
    @media (max-width: 420px) {
      .field--dob .dob-grid { grid-template-columns: 1fr; }
    }
    .field--dob .dob-part label { display: none; }
    .field--dob .dob-part input { text-align: center; }
    .field--dob .dob-part:first-child input { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
    .field--dob .dob-part:last-child input { border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
    .actions { display: flex; gap: 0.75rem; margin-top: 2rem; }
    .btn {
      flex: 1; padding: 0.95rem 1.5rem;
      border-radius: 10px; border: none;
      font: inherit; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .btn:active { transform: scale(0.98); }
    .btn--primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      color: var(--bg);
      box-shadow: 0 4px 18px rgba(34, 211, 238, 0.35);
    }
    .btn--primary:hover { box-shadow: 0 6px 24px rgba(34, 211, 238, 0.45); }
    .btn--secondary {
      background: transparent; color: var(--fg);
      border: 1px solid var(--border);
    }
    .btn--secondary:hover { border-color: var(--accent); color: var(--accent); }
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      padding: 1rem 1.5rem; border-radius: 10px;
      background: var(--bg-card); border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 0.75rem;
      transform: translateX(150%); opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 100;
    }
    .toast.show { transform: translateX(0); opacity: 1; }
    .toast--success { border-color: var(--success); }
    .toast--error { border-color: var(--error); }
    .toast svg { flex-shrink: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <form class="form-card" id="familyForm" novalidate>
    <header class="form-header">
      <div class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>
      <h1>Registro Familiar</h1>
      <p>Completa los datos para crear el perfil</p>
    </header>

    <div class="form-grid">
      <div class="form-row form-row--half">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required autocomplete="given-name">
        </div>
        <div class="field">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required autocomplete="family-name">
        </div>
      </div>

      <div class="field">
        <label for="fecha">Fecha de registro</label>
        <input type="date" id="fecha" name="fecha" required>
      </div>

      <div class="form-row form-row--half">
        <div class="field">
          <label for="hijoNombre">Nombre del hijo/a</label>
          <input type="text" id="hijoNombre" name="hijoNombre" placeholder="Nombre del niño/a" required autocomplete="given-name">
        </div>
        <div class="field field--dob">
          <label for="hijoDia">Fecha de nacimiento del hijo/a</label>
          <div class="dob-grid">
            <div class="dob-part">
              <label class="sr-only" for="hijoDia">Día</label>
              <input type="number" id="hijoDia" name="hijoDia" placeholder="DD" min="1" max="31" required inputmode="numeric" pattern="\d{1,2}" maxlength="2">
            </div>
            <div class="dob-part">
              <label class="sr-only" for="hijoMes">Mes</label>
              <input type="number" id="hijoMes" name="hijoMes" placeholder="MM" min="1" max="12" required inputmode="numeric" pattern="\d{1,2}" maxlength="2">
            </div>
            <div class="dob-part">
              <label class="sr-only" for="hijoAnio">Año</label>
              <input type="number" id="hijoAnio" name="hijoAnio" placeholder="AAAA" min="1900" max="2099" required inputmode="numeric" pattern="\d{4}" maxlength="4">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn--secondary" id="btnLimpiar">Limpiar</button>
      <button type="submit" class="btn btn--primary" id="btnEnviar">Guardar registro</button>
    </div>
  </form>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="toast-icon">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toastMsg">Registro guardado correctamente</span>
  </div>

  <script>
    (function() {
      const form = document.getElementById('familyForm');
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = toast.querySelector('.toast-icon');
      const btnEnviar = document.getElementById('btnEnviar');
      const btnLimpiar = document.getElementById('btnLimpiar');

      function showToast(msg, success = true) {
        toastMsg.textContent = msg;
        toast.classList.toggle('toast--success', success);
        toast.classList.toggle('toast--error', !success);
        toastIcon.innerHTML = success
          ? '<polyline points="20 6 9 17 4 12"></polyline>'
          : '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3500);
      }

      function validateDateParts(day, month, year) {
        const d = parseInt(day, 10), m = parseInt(month, 10), y = parseInt(year, 10);
        if (!d || !m || !y) return false;
        const date = new Date(y, m - 1, d);
        return date.getFullYear() === y && date.getMonth() === m - 1 && date.getDate() === d;
      }

      function getFormData() {
        const fd = new FormData(form);
        return {
          nombre: fd.get('nombre')?.trim(),
          apellido: fd.get('apellido')?.trim(),
          fecha: fd.get('fecha'),
          hijoNombre: fd.get('hijoNombre')?.trim(),
          hijoDia: fd.get('hijoDia'),
          hijoMes: fd.get('hijoMes'),
          hijoAnio: fd.get('hijoAnio'),
        };
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const data = getFormData();
        if (!data.nombre || !data.apellido || !data.fecha || !data.hijoNombre) {
          showToast('Completa todos los campos obligatorios', false);
          return;
        }
        if (!validateDateParts(data.hijoDia, data.hijoMes, data.hijoAnio)) {
          showToast('Fecha de nacimiento del hijo inválida', false);
          return;
        }
        const payload = {
          ...data,
          hijoFechaNacimiento: `${data.hijoAnio}-${String(data.hijoMes).padStart(2,'0')}-${String(data.hijoDia).padStart(2,'0')}`,
          timestamp: new Date().toISOString()
        };
        console.log('✅ Datos del formulario:', payload);
        showToast('Registro guardado correctamente');
        btnEnviar.disabled = true;
        btnEnviar.textContent = 'Guardado ✓';
        setTimeout(() => { btnEnviar.disabled = false; btnEnviar.textContent = 'Guardar registro'; }, 2000);
      });

      btnLimpiar.addEventListener('click', () => {
        form.reset();
        form.querySelectorAll('input').forEach(i => i.style.borderColor = '');
        showToast('Formulario limpiado');
      });

      form.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', () => {
          if (input.checkValidity()) input.style.borderColor = '';
        });
        input.addEventListener('blur', () => {
          if (input.value && !input.checkValidity()) input.style.borderColor = 'var(--error)';
          else if (input.value) input.style.borderColor = 'var(--success)';
        });
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.ctrlKey) form.requestSubmit();
      });
    })();
  </script>
</body>
</html>
