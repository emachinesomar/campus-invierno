<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Inscripción — Actividad Invernal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --bg-card: #1e293b;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent-dim: #0891b2;
      --border: #334155;
      --error: #f87171;
      --success: #4ade80;
      --focus-ring: rgba(34, 211, 238, 0.28);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      --radius: 18px;
      --transition: 180ms ease;
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #eef6f9;
        --bg-card: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --accent: #0891b2;
        --accent-dim: #0e7490;
        --border: #cbd5e1;
        --shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
      }
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      font-family: "Inter", system-ui, sans-serif;
      line-height: 1.5;
      color: var(--fg);
      background:
        radial-gradient(circle at top left, rgba(34, 211, 238, 0.12), transparent 30rem),
        var(--bg);
    }

    .form-card {
      width: min(100%, 680px);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      box-shadow: var(--shadow);
      animation: appear 500ms ease-out;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-header {
      padding: 30px 32px 24px;
      border-bottom: 1px solid var(--border);
    }

    .form-heading {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon {
      width: 52px;
      height: 52px;
      flex: 0 0 52px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #083344;
      background: linear-gradient(135deg, #67e8f9, #22d3ee);
      box-shadow: 0 8px 22px rgba(34, 211, 238, 0.22);
    }

    .form-header h1 {
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .form-header p {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .form-content {
      display: grid;
      gap: 28px;
      padding: 28px 32px 32px;
    }

    .form-section {
      display: grid;
      gap: 16px;
      border: 0;
    }

    .form-section legend {
      width: 100%;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      min-width: 0;
    }

    .field--full {
      grid-column: 1 / -1;
    }

    .field label,
    .dob-label {
      display: block;
      margin-bottom: 7px;
      color: var(--fg);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .required {
      color: var(--error);
    }

    .field input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      font-size: 0.95rem;
      padding: 10px 13px;
      transition:
        border-color var(--transition),
        box-shadow var(--transition),
        background var(--transition);
    }

    .field input::placeholder {
      color: var(--muted);
      opacity: 0.65;
    }

    .field input:hover {
      border-color: var(--accent-dim);
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .field input[aria-invalid="true"] {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.12);
    }

    .dob-grid {
      display: grid;
      grid-template-columns: 0.8fr 0.8fr 1.4fr;
      gap: 8px;
    }

    .dob-grid input {
      text-align: center;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding-top: 4px;
    }

    .btn {
      min-height: 48px;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 10px 20px;
      font: inherit;
      font-size: 0.93rem;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition),
        background var(--transition);
    }

    .btn:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 3px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .btn--primary {
      min-width: 180px;
      color: #083344;
      background: linear-gradient(135deg, #67e8f9, #22d3ee);
      box-shadow: 0 8px 22px rgba(34, 211, 238, 0.22);
    }

    .btn--primary:hover:not(:disabled) {
      box-shadow: 0 10px 28px rgba(34, 211, 238, 0.32);
    }

    .btn--secondary {
      border-color: var(--border);
      color: var(--fg);
      background: transparent;
    }

    .btn--secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 100;
      max-width: calc(100vw - 40px);
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-left-width: 4px;
      border-radius: 10px;
      background: var(--bg-card);
      box-shadow: var(--shadow);
      padding: 14px 18px;
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: opacity 250ms ease, transform 250ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast--success {
      border-left-color: var(--success);
    }

    .toast--error {
      border-left-color: var(--error);
    }

    .toast-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toast--success .toast-icon {
      color: var(--success);
    }

    .toast--error .toast-icon {
      color: var(--error);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      body {
        align-items: start;
        padding: 16px 12px;
      }

      .form-header {
        padding: 24px 20px 20px;
      }

      .form-content {
        padding: 24px 20px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-actions {
        flex-direction: column-reverse;
      }

      .btn {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <form class="form-card" id="familyForm" novalidate>
      <header class="form-header">
        <div class="form-heading">
          <div class="icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>

          <div>
            <h1>Inscripción Actividad Invernal</h1>
            <p>Completa los datos para crear el perfil familiar</p>
          </div>
        </div>
      </header>

      <div class="form-content">
        <fieldset class="form-section">
          <legend>Datos del adulto responsable</legend>

          <div class="form-grid">
            <div class="field">
              <label for="nombre">Nombre <span class="required">*</span></label>
              <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ej. María"
                required
                autocomplete="given-name">
            </div>

            <div class="field">
              <label for="apellido">Apellido <span class="required">*</span></label>
              <input
                type="text"
                id="apellido"
                name="apellido"
                placeholder="Ej. González"
                required
                autocomplete="family-name">
            </div>

            <div class="field field--full">
              <label for="fecha">Fecha de registro <span class="required">*</span></label>
              <input type="date" id="fecha" name="fecha" required>
            </div>
          </div>
        </fieldset>

        <fieldset class="form-section">
          <legend>Datos del participante</legend>

          <div class="form-grid">
            <div class="field">
              <label for="hijoNombre">Nombre del hijo/a <span class="required">*</span></label>
              <input
                type="text"
                id="hijoNombre"
                name="hijoNombre"
                placeholder="Nombre del niño/a"
                required
                autocomplete="off">
            </div>

            <div class="field">
              <span class="dob-label" id="fechaNacimientoLabel">
                Fecha de nacimiento <span class="required">*</span>
              </span>

              <div class="dob-grid" role="group" aria-labelledby="fechaNacimientoLabel">
                <div>
                  <label class="sr-only" for="hijoDia">Día de nacimiento</label>
                  <input
                    type="number"
                    id="hijoDia"
                    name="hijoDia"
                    placeholder="DD"
                    min="1"
                    max="31"
                    required
                    inputmode="numeric"
                    aria-label="Día de nacimiento">
                </div>

                <div>
                  <label class="sr-only" for="hijoMes">Mes de nacimiento</label>
                  <input
                    type="number"
                    id="hijoMes"
                    name="hijoMes"
                    placeholder="MM"
                    min="1"
                    max="12"
                    required
                    inputmode="numeric"
                    aria-label="Mes de nacimiento">
                </div>

                <div>
                  <label class="sr-only" for="hijoAnio">Año de nacimiento</label>
                  <input
                    type="number"
                    id="hijoAnio"
                    name="hijoAnio"
                    placeholder="AAAA"
                    min="1900"
                    max="2099"
                    required
                    inputmode="numeric"
                    aria-label="Año de nacimiento">
                </div>
              </div>
            </div>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="button" class="btn btn--secondary" id="btnLimpiar">
            Limpiar
          </button>
          <button type="submit" class="btn btn--primary" id="btnEnviar">
            Guardar registro
          </button>
        </div>
      </div>
    </form>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg class="toast-icon" id="toastIcon" viewBox="0 0 24 24" aria-hidden="true">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toastMsg"></span>
  </div>

  <script>
    (() => {
      const form = document.getElementById("familyForm");
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      const toastIcon = document.getElementById("toastIcon");
      const btnEnviar = document.getElementById("btnEnviar");
      const btnLimpiar = document.getElementById("btnLimpiar");

      function showToast(message, success = true) {
        toastMsg.textContent = message;
        toast.classList.toggle("toast--success", success);
        toast.classList.toggle("toast--error", !success);

        toastIcon.innerHTML = success
          ? '<polyline points="20 6 9 17 4 12"></polyline>'
          : '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>';

        toast.classList.add("show");
        window.clearTimeout(showToast.timeout);
        showToast.timeout = window.setTimeout(() => {
          toast.classList.remove("show");
        }, 3500);
      }

      function validateDateParts(day, month, year) {
        const d = Number.parseInt(day, 10);
        const m = Number.parseInt(month, 10);
        const y = Number.parseInt(year, 10);

        if (!d || !m || !y) return false;

        const date = new Date(y, m - 1, d);
        return date.getFullYear() === y
          && date.getMonth() === m - 1
          && date.getDate() === d;
      }

      function getFormData() {
        const fd = new FormData(form);

        return {
          nombre: String(fd.get("nombre") || "").trim(),
          apellido: String(fd.get("apellido") || "").trim(),
          fecha: fd.get("fecha"),
          hijoNombre: String(fd.get("hijoNombre") || "").trim(),
          hijoDia: fd.get("hijoDia"),
          hijoMes: fd.get("hijoMes"),
          hijoAnio: fd.get("hijoAnio")
        };
      }

      function clearInvalidState() {
        form.querySelectorAll("input").forEach((input) => {
          input.removeAttribute("aria-invalid");
        });
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        clearInvalidState();

        const data = getFormData();

        if (!data.nombre || !data.apellido || !data.fecha || !data.hijoNombre) {
          const firstEmpty = Array.from(form.querySelectorAll("[required]"))
            .find((input) => !input.value.trim());

          if (firstEmpty) {
            firstEmpty.setAttribute("aria-invalid", "true");
            firstEmpty.focus();
          }

          showToast("Completa todos los campos obligatorios", false);
          return;
        }

        if (!validateDateParts(data.hijoDia, data.hijoMes, data.hijoAnio)) {
          ["hijoDia", "hijoMes", "hijoAnio"].forEach((id) => {
            document.getElementById(id).setAttribute("aria-invalid", "true");
          });
          document.getElementId = null;
          document.getElementById("hijoDia").focus();
          showToast("Fecha de nacimiento del hijo/a inválida", false);
          return;
        }

        const payload = {
          ...data,
          hijoFechaNacimiento:
            `${data.hijoAnio}-${String(data.hijoMes).padStart(2, "0")}-${String(data.hijoDia).padStart(2, "0")}`,
          timestamp: new Date().toISOString()
        };

        console.log("Datos del formulario:", payload);
        showToast("Registro guardado correctamente");

        btnEnviar.disabled = true;
        btnEnviar.textContent = "Guardado ✓";

        window.setTimeout(() => {
          btnEnviar.disabled = false;
          btnEnviar.textContent = "Guardar registro";
        }, 2000);
      });

      btnLimpiar.addEventListener("click", () => {
        form.reset();
        clearInvalidState();
        showToast("Formulario limpiado");
      });

      form.querySelectorAll("input").forEach((input) => {
        input.addEventListener("input", () => {
          input.removeAttribute("aria-invalid");
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && event.ctrlKey) {
          form.requestSubmit();
        }
      });
    })();
  </script>
</body>
</html>
