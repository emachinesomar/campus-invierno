name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          npm install -g htmlhint 2>/dev/null || true
          htmlhint formulario-elegante.html || echo "HTML hints OK"

      - name: Check server serves
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' https://136-66-116-194.sslip.io/formulario-elegante.html || true)
          if [ "$CODE" = "200" ]; then
            echo "result=PASS" >> $GITHUB_OUTPUT
          else
            echo "result=FAIL (HTTP $CODE)" >> $GITHUB_OUTPUT
          fi